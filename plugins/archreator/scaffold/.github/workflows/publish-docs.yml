# Publishes the model as a website, so the people who never open the
# repository can still read it. The Markdown stays the source of truth; this
# only renders it.
#
# TEMPLATE — it needs GitHub Pages switched on for the repository (Settings →
# Pages → Source: GitHub Actions) and nothing else. Delete this file if the
# model is not meant to be published; publishing an architecture is a
# disclosure decision, not a technical one.

name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "architecture/**"
      - "docs/**"
      - "*.md"
      - "mkdocs.yml"
      - "overrides/**"
      - "scripts/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv reads the dependencies from the script's own inline metadata, so
      # there is no requirements file to keep in step with it.
      - uses: astral-sh/setup-uv@v5
      - name: Build the portal
        run: uv run scripts/build_docs.py
      - name: Upload the portal as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .docs/site
      # The site is what this workflow is for; the PDF is a convenience. A
      # runner without a browser, or without a route to the diagram library,
      # marks this step amber rather than holding up the publication.
      - name: Export the PDF
        continue-on-error: true
        run: uv run scripts/export_pdf.py --no-build
      - name: Attach the PDF to this run
        uses: actions/upload-artifact@v4
        with:
          name: architecture-pdf
          path: .docs/*.pdf
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
