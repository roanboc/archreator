# The model as a website, published on every change that could alter it.
# Activated by `establish-project` only for a **public** GitHub repository:
# on the free plan a private repository cannot publish Pages at all, and on
# the plans where it can, publishing a private model is a disclosure decision
# rather than a default.
#
# Before this runs, Pages has to be switched on:
#   Settings → Pages → Source: GitHub Actions
# Without it the deploy step fails, which is why bootstrap enables Pages in
# the same sitting or leaves this file out.
#
# Not active where it sits: the automation host reads `.github/workflows/`
# and nothing else. Moving this file there is what switches it on.

name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "architecture/**"
      - "*.md"
      - "mkdocs.yml"
      - "overrides/**"
      - "scripts/**"
  # Run it once by hand before trusting it on every push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # uv reads MkDocs and the theme from the script's own inline metadata,
      # so the portal's dependencies are declared in one place.
      - uses: astral-sh/setup-uv@v5
      - name: Build the portal
        run: uv run scripts/build_docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
