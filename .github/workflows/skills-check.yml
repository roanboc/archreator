name: Method check

on:
  pull_request:
    paths:
      - "plugins/archreator/**"
      - "docs/process/**"
      - "docs/skill-format.md"
      - ".claude-plugin/**"
      - ".github/workflows/skills-check.yml"
  push:
    branches: [main]
    paths:
      - "plugins/archreator/**"
      - "docs/process/**"
      - "docs/skill-format.md"
      - ".claude-plugin/**"
      - ".github/workflows/skills-check.yml"

jobs:
  validate-method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check typed skills, process bindings, manifests and scaffold
        run: python3 plugins/archreator/scripts/check_method.py
      - name: Test the method validator and source-fresh runtime
        run: python3 -m unittest discover plugins/archreator/scripts/tests
      - name: Test the on-demand portal
        run: python3 -m unittest discover plugins/archreator/portal -p "test_*.py"
