name: Docs check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.html"
      - "plugins/archreator/scaffold/scripts/*.py"
      - "plugins/archreator/scripts/*.py"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.html"
      - "plugins/archreator/scaffold/scripts/*.py"
      - "plugins/archreator/scripts/*.py"
      - ".github/workflows/docs-check.yml"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown and HTML links
        run: python3 plugins/archreator/scaffold/scripts/check_links.py
      - name: Check element-ID references
        run: python3 plugins/archreator/scaffold/scripts/check_model.py

  # What proves the reading tools still work is running them on a project.
  # test_project_tools.py builds one from the shipped scaffold, so a change
  # that breaks a new project fails here rather than in somebody's first
  # commit. It also asserts nothing writes a database.
  read-a-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tools read a project built from the scaffold
        run: uv run --with pytest pytest plugins/archreator/scripts/tests/ -q

  # The portal is stock MkDocs Material with no theme of ours, so what is worth
  # proving is that the config the method writes still builds and still renders
  # Mermaid - which is the whole reason the config exists.
  build-portal:
    runs-on: ubuntu-latest
    needs: read-a-project
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: A generated portal config builds, and draws its diagrams
        run: |
          set -euo pipefail
          probe="$(mktemp -d)/probe"
          cp -r plugins/archreator/scaffold "$probe"
          printf '\n## A diagram\n\n```mermaid\nflowchart LR\n  a["one"] --> b["two"]\n```\n' \
            >> "$probe/architecture/README.md"
          uv run plugins/archreator/scripts/model.py --project "$probe" portal
          uvx --with mkdocs-material mkdocs build \
            -f "$probe/.archreator/work/portal/mkdocs.yml"
          grep -rq 'class="mermaid"' "$probe/.archreator/work/portal/site/" \
            || { echo "the portal did not render Mermaid" >&2; exit 1; }
