name: Documentation check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "site/**"
      - "plugins/archreator/portal/**"
      - "plugins/archreator/scripts/**"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "site/**"
      - "plugins/archreator/portal/**"
      - "plugins/archreator/scripts/**"
      - ".github/workflows/docs-check.yml"

jobs:
  check-reading-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the repository method and documentation links
        run: python3 plugins/archreator/scripts/check_method.py
      - name: Check the minimal scaffold model
        run: python3 plugins/archreator/scripts/archreator.py --repo plugins/archreator/scaffold check
      - name: Build the portal from the minimal scaffold
        run: python3 plugins/archreator/scripts/archreator.py --repo plugins/archreator/scaffold portal
